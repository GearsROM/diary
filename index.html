<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>GearsROM // ДНЕВНИК ЭН [DEGRADED]</title>
  <style>
    :root{
      --bg:#0a0b0d; --panel:#0e1014; --line:#23262d;
      --txt:#c2c8d2; --dim:#5f6773; --head:#e6ebf2;
      --red:#ff2e2e; --green:#7cffb2; --amber:#ffd24a; --cyan:#36d6ff;
      --sans:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{ background:var(--bg); color:var(--txt); font-family:var(--mono);
          margin:0; padding:0; line-height:1.65; font-size:14px;
          overflow:hidden; position:relative; }

    .noise{ position:fixed; inset:0; pointer-events:none; z-index:300;
            background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.32) 3px, rgba(0,0,0,0) 4px);
            mix-blend-mode:multiply; opacity:.6; animation:noiseShift .35s steps(2) infinite; }
    .grain{ position:fixed; inset:-60%; pointer-events:none; z-index:299; opacity:.08;
            background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");
            animation:grainMove .45s steps(3) infinite; }
    @keyframes noiseShift{ 0%{transform:translateY(0)} 50%{transform:translateY(1px)} 100%{transform:translateY(0)} }
    @keyframes grainMove{ 0%{transform:translate(0,0)} 33%{transform:translate(-4%,3%)} 66%{transform:translate(3%,-4%)} 100%{transform:translate(0,0)} }
    .sweep{ position:fixed; left:0; right:0; height:3px; top:0; z-index:301; pointer-events:none;
            background:linear-gradient(90deg,transparent,rgba(124,255,178,.22),rgba(255,46,46,.12),transparent);
            animation:sweep 5s linear infinite; }
    @keyframes sweep{ 0%{top:-3px;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:100vh;opacity:0} }
    .burst{ position:fixed; inset:0; pointer-events:none; z-index:302; opacity:0;
            background:rgba(255,46,46,.06); mix-blend-mode:screen; }
    .burst.on{ animation:burstAnim .18s steps(2) 1; }
    @keyframes burstAnim{ 0%{opacity:0;transform:translate(0,0);filter:none;} 20%{opacity:1;transform:translate(-6px,2px);filter:invert(1) hue-rotate(90deg);} 40%{opacity:.6;transform:translate(5px,-3px);} 60%{opacity:1;transform:translate(-3px,1px);filter:invert(.5);} 100%{opacity:0;transform:translate(0,0);filter:none;} }

    /* ===== ЭКРАН ВХОДА (gate) ===== */
    #gate{ position:fixed; inset:0; z-index:200; background:var(--bg);
           display:flex; align-items:center; justify-content:center; padding:20px; }
    #gate.hidden{ display:none; }
    .gate-box{ max-width:420px; width:100%; background:var(--panel); border:1px solid var(--line);
               border-left:3px solid var(--red); border-radius:8px; padding:26px;
               box-shadow:0 0 50px rgba(255,46,46,.12); }
    .gate-box .tag{ font-family:var(--sans); color:var(--red); font-weight:700; letter-spacing:2px;
                    font-size:11px; text-transform:uppercase; margin-bottom:6px; }
    .gate-box h2{ font-family:var(--sans); color:var(--head); font-size:17px; margin:0 0 4px; }
